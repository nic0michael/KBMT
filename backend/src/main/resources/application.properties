spring.application.name=togafmate-backend
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
spring.config.import=optional:file:docker-compose/.env[.properties],optional:file:../docker-compose/.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:togafmate}}
spring.datasource.username=${DB_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:}
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
app.knowledge-base.max-file-size-bytes=${KB_FILE_MAX_SIZE_BYTES:102400}
app.database.backup.directory=${DATABASE_BACKUP_DIRECTORY:/var/lib/postgresql/backup}
app.database.backup.jdbc-url=${DB_URL:${spring.datasource.url}}
app.database.backup.dump-command=${DATABASE_DUMP_COMMAND:pg_dump}
app.database.backup.restore-command=${DATABASE_RESTORE_COMMAND:pg_restore}
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
